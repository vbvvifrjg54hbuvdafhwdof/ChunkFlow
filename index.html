<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChunkReader - スラッシュリーディング & 音読管理</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .chunk-hover { transition: all 0.15s ease; }
    .chunk-hover:hover { background-color: rgba(238, 242, 255, 0.8); transform: translateY(-1px); }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー / ツールバー -->
  <header class="bg-white border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      
      <!-- ロゴ & ナビゲーション -->
      <div class="flex items-center space-x-4">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-100">
            <i class="fa-solid fa-book-open text-sm"></i>
          </div>
          <h1 class="text-xl font-bold tracking-tight text-slate-800 hidden sm:block">ChunkReader</h1>
        </div>

        <!-- 画面切替タブ -->
        <nav class="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold">
          <button id="nav-reader" class="px-3.5 py-1.5 rounded-lg transition bg-white text-indigo-600 shadow-sm">
            <i class="fa-solid fa-book-reader mr-1"></i> 読解
          </button>
          <button id="nav-import" class="px-3.5 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900">
            <i class="fa-solid fa-plus mr-1"></i> JSON追加
          </button>
        </nav>
      </div>

      <!-- 表示コントロール（読解画面用） -->
      <div id="toolbar-controls" class="flex flex-wrap items-center gap-2 sm:gap-3 bg-slate-100/80 p-1.5 rounded-2xl border border-slate-200/60 shadow-inner">
        
        <!-- スラッシュ ON/OFF -->
        <button id="toggle-slash" class="px-3.5 py-1.5 rounded-xl font-semibold text-xs transition flex items-center gap-1.5 bg-white text-slate-800 shadow-sm">
          <span class="text-sm font-bold text-indigo-500">/</span> スラッシュ
        </button>

        <!-- 赤字ハイライト ON/OFF -->
        <button id="toggle-highlight" class="px-3.5 py-1.5 rounded-xl font-semibold text-xs transition flex items-center gap-1.5 bg-white text-slate-800 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span> 重要語
        </button>

        <!-- 和訳モード切替 -->
        <div class="flex bg-slate-200/70 p-0.5 rounded-xl text-xs font-semibold">
          <button id="mode-tap" class="px-3 py-1.5 rounded-lg transition bg-white text-indigo-600 shadow-sm">タップ表示</button>
          <button id="mode-all" class="px-3 py-1.5 rounded-lg transition text-slate-500 hover:text-slate-800">全表示</button>
          <button id="mode-none" class="px-3 py-1.5 rounded-lg transition text-slate-500 hover:text-slate-800">非表示</button>
        </div>

        <!-- 白文（Raw）モード -->
        <button id="toggle-raw" class="px-3.5 py-1.5 rounded-xl font-semibold text-xs transition flex items-center gap-1.5 border border-slate-200 text-slate-600 hover:bg-white">
          <i class="fa-solid fa-leaf text-emerald-500 text-xs"></i> 白文
        </button>
      </div>

    </div>
  </header>

  <!-- メインレイアウト -->
  <div class="flex-1 flex max-w-7xl w-full mx-auto">
    
    <!-- サイドバー：フォルダ＆ライブラリツリー -->
    <aside id="sidebar" class="w-80 bg-white border-r border-slate-200/80 flex-shrink-0 flex flex-col justify-between">
      <div class="p-4 overflow-y-auto max-h-[calc(100vh-120px)]">
        
        <!-- フォルダ追加ボタン -->
        <button id="btn-add-root-folder" class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200/80 text-slate-700 font-semibold text-xs rounded-xl border border-slate-200 transition flex items-center justify-center gap-2 mb-4">
          <i class="fa-solid fa-folder-plus text-indigo-600"></i> ＋ 新しいフォルダを追加
        </button>

        <h2 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-2 mb-2">ライブラリ</h2>
        
        <!-- フォルダツリー領域 -->
        <div id="tree-container" class="space-y-1 text-xs"></div>
      </div>

      <div class="p-3 border-t border-slate-100 text-[11px] text-slate-400 text-center font-medium">
        データはブラウザ内に自動保存されます
      </div>
    </aside>

    <!-- メイン表示領域 -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto">

      <!-- VIEW 1: 読解画面 -->
      <section id="view-reader" class="max-w-4xl mx-auto bg-white rounded-3xl p-6 md:p-12 shadow-sm border border-slate-200/60 min-h-[550px] flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between border-b border-slate-100 pb-5 mb-8">
            <div>
              <span id="current-folder-path" class="text-xs text-indigo-500 font-semibold mb-1 block"></span>
              <h2 id="current-title" class="text-xl md:text-2xl font-bold text-slate-800 tracking-tight"></h2>
            </div>
            <button id="btn-open-delete" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition" title="削除">
              <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
          </div>

          <div id="reader-content" class="space-y-8 text-lg md:text-xl leading-relaxed">
            <!-- チャンクテキスト描画エリア -->
          </div>
        </div>

        <div id="empty-state" class="hidden text-center py-20">
          <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
          <p class="text-slate-500 font-medium">文章が選択されていないか、ライブラリが空です。</p>
        </div>
      </section>

      <!-- VIEW 2: JSON追加画面 -->
      <section id="view-import" class="max-w-3xl mx-auto bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-slate-200/60 hidden space-y-6">
        <div class="border-b border-slate-100 pb-4">
          <h2 class="text-xl font-bold text-slate-800">新しい英文（JSON）を登録</h2>
          <p class="text-xs text-slate-500 mt-1">LLM（ChatGPTやGeminiなど）が出力したJSONコードを貼り付けてください。</p>
        </div>

        <div class="space-y-4">
          <!-- 保存先フォルダ選択 -->
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">保存先フォルダ</label>
            <select id="import-folder-select" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
              <!-- 動的にフォルダ階層が挿入されます -->
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">タイトル（任意）</label>
            <input type="text" id="import-title" placeholder="例: 今日のニュース解説" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">JSONコード</label>
              <button id="btn-paste-clipboard" type="button" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 px-2 py-1 bg-indigo-50 rounded-lg transition">
                <i class="fa-solid fa-paste"></i> クリップボードから貼り付け
              </button>
            </div>
            <textarea id="import-json" rows="10" placeholder='[&#10;  {&#10;    "sentence_id": 1,&#10;    "chunks": [ ... ]&#10;  }&#10;]' class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition"></textarea>
          </div>

          <!-- エラー表示エリア -->
          <div id="import-error" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-600 font-medium"></div>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button id="btn-cancel-import" type="button" class="px-6 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">キャンセル</button>
          <button id="btn-save-import" type="button" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-md shadow-indigo-100 transition">登録して読む</button>
        </div>
      </section>

    </main>

  </div>

  <!-- 【モーダル 1】フォルダ作成ダイアログ -->
  <div id="modal-folder" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-4">
      <h3 id="modal-folder-title" class="text-base font-bold text-slate-800">新しいフォルダを作成</h3>
      <input type="text" id="folder-name-input" placeholder="フォルダ名を入力" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
      <div class="flex justify-end gap-2 pt-2">
        <button id="btn-cancel-folder" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 text-xs font-semibold">キャンセル</button>
        <button id="btn-save-folder" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">作成</button>
      </div>
    </div>
  </div>

  <!-- 【モーダル 2】二重確認用 削除ダイアログ -->
  <div id="modal-delete" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl border border-slate-100 space-y-6 text-center">
      <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div class="space-y-2">
        <h3 id="delete-modal-heading" class="text-lg font-bold text-slate-800">本当に削除しますか？</h3>
        <p id="delete-target-title" class="text-sm text-slate-500 font-medium px-4 break-words"></p>
        <p class="text-xs text-rose-500 font-medium">この操作は取り消せません。</p>
      </div>
      <div class="flex justify-center gap-3 pt-2">
        <button id="btn-cancel-delete" class="w-1/2 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 text-sm font-semibold transition">キャンセル</button>
        <button id="btn-confirm-delete" class="w-1/2 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold shadow-md shadow-rose-100 transition">削除実行</button>
      </div>
    </div>
  </div>

  <!-- アプリJSロジック -->
  <script>
    // 初期サンプルデータ
    const SAMPLE_FOLDERS = [
      { id: "f-1", name: "ニュース・IT", parentId: null },
      { id: "f-2", name: "人工知能 (AI)", parentId: "f-1" }
    ];

    const SAMPLE_TEXTS = [
      {
        id: "text-1",
        folderId: "f-2",
        title: "サンプル：AIと将来の仕事",
        data: [
          {
            "sentence_id": 1,
            "chunks": [
              { "en": "In recent years,", "is_important": false, "ja": "近年、" },
              { "en": "artificial intelligence has advanced", "is_important": false, "ja": "人工知能は進化してきた" },
              { "en": "at an unprecedented speed,", "is_important": false, "ja": "前例のない速度で、" },
              { "en": "changing the way", "is_important": false, "ja": "〜という方法を変えながら" },
              { "en": "we live and work.", "is_important": false, "ja": "私たちが生活し働く（方法を）。" }
            ]
          },
          {
            "sentence_id": 2,
            "chunks": [
              { "en": "Although many experts predict", "is_important": true, "ja": "多くの専門家は〜と予測しているが、" },
              { "en": "that AI will automate routine tasks", "is_important": false, "ja": "AIが定型業務を自動化し" },
              { "en": "and increase productivity,", "is_important": false, "ja": "生産性を高めると（予測しているが）、" },
              { "en": "others worry", "is_important": false, "ja": "ほかの人々は懸念している" },
              { "en": "that it could lead to", "is_important": false, "ja": "それが〜につながる可能性があると" },
              { "en": "widespread job loss.", "is_important": false, "ja": "広範な雇用喪失に。" }
            ]
          },
          {
            "sentence_id": 3,
            "chunks": [
              { "en": "However,", "is_important": true, "ja": "しかしながら、" },
              { "en": "history shows", "is_important": false, "ja": "歴史が示しているのは" },
              { "en": "that technological revolutions", "is_important": false, "ja": "技術革命が" },
              { "en": "usually create new types of jobs", "is_important": false, "ja": "通常、新しい種類の仕事を生み出すということだ" },
              { "en": "while destroying old ones.", "is_important": true, "ja": "古いものを破壊する一方で。" }
            ]
          },
          {
            "sentence_id": 4,
            "chunks": [
              { "en": "For instance,", "is_important": true, "ja": "例えば、" },
              { "en": "while traditional manufacturing jobs have declined,", "is_important": true, "ja": "従来の製造業の仕事が減少した一方で、" },
              { "en": "demand for software engineers and data analysts", "is_important": false, "ja": "ソフトウェアエンジニアやデータアナリストの需要は" },
              { "en": "has skyrocketed.", "is_important": false, "ja": "急増した。" }
            ]
          },
          {
            "sentence_id": 5,
            "chunks": [
              { "en": "In addition,", "is_important": true, "ja": "さらに、" },
              { "en": "lifelong learning will become essential", "is_important": false, "ja": "生涯学習が不可欠になるだろう" },
              { "en": "for workers.", "is_important": false, "ja": "労働者にとって。" }
            ]
          }
        ]
      }
    ];

    // アプリ状態
    let folders = [];
    let texts = [];
    let currentTextId = null;
    let targetParentFolderId = null; // サブフォルダ作成時の親ID
    let deleteTarget = null; // { type: 'text'|'folder', id: '' }

    let config = {
      showSlash: true,
      showHighlight: true,
      transMode: 'tap',
      isRaw: false
    };
    let tappedChunks = {};

    document.addEventListener('DOMContentLoaded', () => {
      const storedFolders = localStorage.getItem('chunk_reader_folders_v5');
      const storedTexts = localStorage.getItem('chunk_reader_texts_v5');

      if (storedFolders && storedTexts) {
        folders = JSON.parse(storedFolders);
        texts = JSON.parse(storedTexts);
      } else {
        folders = SAMPLE_FOLDERS;
        texts = SAMPLE_TEXTS;
        saveToLocalStorage();
      }

      if (texts.length > 0) currentTextId = texts[0].id;

      setupEventListeners();
      updateToggleStyles();
      renderTree();
      switchView('reader');
    });

    function saveToLocalStorage() {
      localStorage.setItem('chunk_reader_folders_v5', JSON.stringify(folders));
      localStorage.setItem('chunk_reader_texts_v5', JSON.stringify(texts));
    }

    function switchView(viewName) {
      document.getElementById('view-reader').classList.toggle('hidden', viewName !== 'reader');
      document.getElementById('view-import').classList.toggle('hidden', viewName !== 'import');

      document.getElementById('toolbar-controls').style.visibility = (viewName === 'reader') ? 'visible' : 'hidden';

      document.getElementById('nav-reader').className = viewName === 'reader'
        ? "px-3.5 py-1.5 rounded-lg transition bg-white text-indigo-600 shadow-sm font-bold"
        : "px-3.5 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900";

      document.getElementById('nav-import').className = viewName === 'import'
        ? "px-3.5 py-1.5 rounded-lg transition bg-white text-indigo-600 shadow-sm font-bold"
        : "px-3.5 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900";

      if (viewName === 'reader') renderReader();
      if (viewName === 'import') renderFolderSelectOptions();
    }

    function setupEventListeners() {
      document.getElementById('nav-reader').onclick = () => switchView('reader');
      document.getElementById('nav-import').onclick = () => switchView('import');
      document.getElementById('btn-cancel-import').onclick = () => switchView('reader');

      // フォルダ追加ボタン
      document.getElementById('btn-add-root-folder').onclick = () => openFolderModal(null);
      document.getElementById('btn-cancel-folder').onclick = closeFolderModal;
      document.getElementById('btn-save-folder').onclick = handleSaveFolder;

      // クリップボード貼り付け
      document.getElementById('btn-paste-clipboard').onclick = async () => {
        try {
          const text = await navigator.clipboard.readText();
          document.getElementById('import-json').value = text;
        } catch (err) {
          alert('クリップボードの読み取り権限がないか、対応していません。手動で貼り付けてください。');
        }
      };

      // トグル
      document.getElementById('toggle-slash').onclick = () => {
        config.showSlash = !config.showSlash;
        updateToggleStyles();
        renderReader();
      };

      document.getElementById('toggle-highlight').onclick = () => {
        config.showHighlight = !config.showHighlight;
        updateToggleStyles();
        renderReader();
      };

      document.getElementById('toggle-raw').onclick = () => {
        config.isRaw = !config.isRaw;
        updateToggleStyles();
        renderReader();
      };

      ['tap', 'all', 'none'].forEach(mode => {
        document.getElementById(`mode-${mode}`).onclick = () => {
          config.transMode = mode;
          tappedChunks = {};
          updateToggleStyles();
          renderReader();
        };
      });

      // JSON保存
      document.getElementById('btn-save-import').onclick = handleSaveImport;

      // 削除モーダル
      document.getElementById('btn-open-delete').onclick = () => {
        const activeText = texts.find(t => t.id === currentTextId);
        if (!activeText) return;
        deleteTarget = { type: 'text', id: activeText.id };
        document.getElementById('delete-modal-heading').textContent = "文章を削除しますか？";
        document.getElementById('delete-target-title').textContent = `「${activeText.title}」`;
        document.getElementById('modal-delete').classList.remove('hidden');
      };

      document.getElementById('btn-cancel-delete').onclick = () => document.getElementById('modal-delete').classList.add('hidden');
      document.getElementById('btn-confirm-delete').onclick = handleConfirmDelete;
    }

    function updateToggleStyles() {
      const slashBtn = document.getElementById('toggle-slash');
      slashBtn.className = config.showSlash
        ? "px-3.5 py-1.5 rounded-xl font-semibold text-xs transition bg-white text-slate-800 shadow-sm border border-slate-200/80"
        : "px-3.5 py-1.5 rounded-xl font-semibold text-xs transition text-slate-400 hover:text-slate-600";

      const hlBtn = document.getElementById('toggle-highlight');
      hlBtn.className = config.showHighlight
        ? "px-3.5 py-1.5 rounded-xl font-semibold text-xs transition bg-white text-slate-800 shadow-sm border border-slate-200/80"
        : "px-3.5 py-1.5 rounded-xl font-semibold text-xs transition text-slate-400 hover:text-slate-600";

      const rawBtn = document.getElementById('toggle-raw');
      rawBtn.className = config.isRaw
        ? "px-3.5 py-1.5 rounded-xl font-semibold text-xs transition bg-emerald-500 text-white shadow-md shadow-emerald-100"
        : "px-3.5 py-1.5 rounded-xl font-semibold text-xs transition border border-slate-200 text-slate-600 hover:bg-white";

      ['tap', 'all', 'none'].forEach(mode => {
        const btn = document.getElementById(`mode-${mode}`);
        if (config.transMode === mode) {
          btn.className = "px-3 py-1.5 rounded-lg transition bg-white text-indigo-600 font-bold shadow-sm";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg transition text-slate-500 hover:text-slate-800 font-medium";
        }
      });
    }

    // フォルダ階層ツリー描画
    function renderTree() {
      const container = document.getElementById('tree-container');
      container.innerHTML = '';

      function buildFolderTree(parentId, level) {
        const ul = document.createElement('ul');
        ul.className = level > 0 ? "pl-3 border-l border-slate-200/80 space-y-1 mt-1" : "space-y-1";

        // サブフォルダ群
        const subFolders = folders.filter(f => f.parentId === parentId);
        subFolders.forEach(f => {
          const li = document.createElement('li');
          
          const folderHeader = document.createElement('div');
          folderHeader.className = "flex items-center justify-between p-1.5 rounded-lg text-slate-700 hover:bg-slate-100 transition group font-medium";
          folderHeader.innerHTML = `
            <span class="flex items-center gap-1.5 truncate">
              <i class="fa-solid fa-folder text-amber-400"></i>
              <span class="truncate">${f.name}</span>
            </span>
            <div class="opacity-0 group-hover:opacity-100 transition flex items-center gap-1">
              <button title="サブフォルダ追加" class="btn-add-sub p-1 hover:text-indigo-600"><i class="fa-solid fa-plus text-[10px]"></i></button>
              <button title="フォルダ削除" class="btn-del-folder p-1 hover:text-rose-600"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
            </div>
          `;

          // サブフォルダ追加
          folderHeader.querySelector('.btn-add-sub').onclick = (e) => {
            e.stopPropagation();
            openFolderModal(f.id);
          };

          // フォルダ削除
          folderHeader.querySelector('.btn-del-folder').onclick = (e) => {
            e.stopPropagation();
            deleteTarget = { type: 'folder', id: f.id };
            document.getElementById('delete-modal-heading').textContent = "フォルダを削除しますか？";
            document.getElementById('delete-target-title').textContent = `「${f.name}」とその中身の全データ`;
            document.getElementById('modal-delete').classList.remove('hidden');
          };

          li.appendChild(folderHeader);

          // フォルダ内のテキスト＆子フォルダを再帰呼び出し
          const childrenUl = buildFolderTree(f.id, level + 1);
          li.appendChild(childrenUl);

          ul.appendChild(li);
        });

        // フォルダ内のテキスト群
        const childTexts = texts.filter(t => t.folderId === parentId);
        childTexts.forEach(t => {
          const li = document.createElement('li');
          const isActive = t.id === currentTextId;
          li.className = `p-1.5 pl-2 rounded-lg cursor-pointer transition flex items-center gap-1.5 ${
            isActive ? 'bg-indigo-50 text-indigo-700 font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-100'
          }`;
          li.innerHTML = `
            <i class="fa-regular fa-file-lines text-slate-400"></i>
            <span class="truncate">${t.title}</span>
          `;
          li.onclick = () => {
            currentTextId = t.id;
            tappedChunks = {};
            renderTree();
            switchView('reader');
          };
          ul.appendChild(li);
        });

        return ul;
      }

      container.appendChild(buildFolderTree(null, 0));
    }

    // JSON登録画面のフォルダ選択ドロップダウン生成
    function renderFolderSelectOptions() {
      const select = document.getElementById('import-folder-select');
      select.innerHTML = '<option value="">(ルート / フォルダなし)</option>';

      function addOptions(parentId, prefix) {
        const sub = folders.filter(f => f.parentId === parentId);
        sub.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.id;
          opt.textContent = prefix + f.name;
          select.appendChild(opt);
          addOptions(f.id, prefix + "　");
        });
      }
      addOptions(null, "📂 ");
    }

    // フォルダパス文字列の取得
    function getFolderPath(folderId) {
      if (!folderId) return "";
      const path = [];
      let curr = folders.find(f => f.id === folderId);
      while (curr) {
        path.unshift(curr.name);
        curr = folders.find(f => f.id === curr.parentId);
      }
      return path.join(' / ');
    }

    // 読解画面描画
    function renderReader() {
      const activeText = texts.find(t => t.id === currentTextId);
      const readerContent = document.getElementById('reader-content');
      const currentTitleEl = document.getElementById('current-title');
      const pathEl = document.getElementById('current-folder-path');
      const emptyState = document.getElementById('empty-state');

      if (!activeText) {
        currentTitleEl.textContent = "文章がありません";
        pathEl.textContent = "";
        readerContent.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      currentTitleEl.textContent = activeText.title;
      pathEl.textContent = getFolderPath(activeText.folderId);
      readerContent.innerHTML = '';

      if (config.isRaw) {
        const p = document.createElement('p');
        p.className = "text-slate-800 leading-relaxed font-normal tracking-wide";
        const fullText = activeText.data
          .map(s => s.chunks.map(c => c.en).join(' '))
          .join(' ');
        p.textContent = fullText;
        readerContent.appendChild(p);
        return;
      }

      activeText.data.forEach((sentence, sIdx) => {
        const sentenceDiv = document.createElement('div');
        sentenceDiv.className = "sentence-block flex flex-wrap items-baseline gap-y-2";

        sentence.chunks.forEach((chunk, cIdx) => {
          const chunkKey = `${sIdx}-${cIdx}`;
          const isLastChunk = cIdx === sentence.chunks.length - 1;

          const chunkWrap = document.createElement('div');
          chunkWrap.className = "inline-flex flex-col mx-0.5 px-1.5 py-1 rounded-lg chunk-hover cursor-pointer";
          
          chunkWrap.onclick = () => {
            if (config.transMode === 'tap') {
              tappedChunks[chunkKey] = !tappedChunks[chunkKey];
              renderReader();
            }
          };

          const enSpan = document.createElement('span');
          enSpan.className = "font-medium select-none tracking-wide text-slate-800";
          
          // ★ 赤文字ハイライト（1単語目だけ赤にする）
          if (config.showHighlight && chunk.is_important) {
            const words = chunk.en.split(' ');
            if (words.length > 0) {
              const firstWord = words[0];
              const restWords = words.slice(1).join(' ');

              const redWordSpan = document.createElement('span');
              redWordSpan.className = "text-rose-600 font-semibold bg-rose-50/80 px-1 rounded";
              redWordSpan.textContent = firstWord;

              enSpan.appendChild(redWordSpan);
              if (restWords) {
                enSpan.appendChild(document.createTextNode(' ' + restWords));
              }
            } else {
              enSpan.textContent = chunk.en;
            }
          } else {
            enSpan.textContent = chunk.en;
          }

          chunkWrap.appendChild(enSpan);

          // 和訳制御
          let showJa = false;
          if (config.transMode === 'all') showJa = true;
          if (config.transMode === 'tap' && tappedChunks[chunkKey]) showJa = true;

          if (showJa && chunk.ja) {
            const jaSpan = document.createElement('span');
            jaSpan.className = "text-xs text-indigo-600 font-normal mt-1 tracking-normal";
            jaSpan.textContent = chunk.ja;
            chunkWrap.appendChild(jaSpan);
          }

          sentenceDiv.appendChild(chunkWrap);

          if (config.showSlash && !isLastChunk) {
            const slashSpan = document.createElement('span');
            slashSpan.className = "text-indigo-300 font-light mx-1 select-none text-base";
            slashSpan.textContent = "/";
            sentenceDiv.appendChild(slashSpan);
          }
        });

        readerContent.appendChild(sentenceDiv);
      });
    }

    // フォルダ追加モーダル関係
    function openFolderModal(parentId) {
      targetParentFolderId = parentId;
      document.getElementById('modal-folder-title').textContent = parentId ? "サブフォルダを追加" : "新しいフォルダを追加";
      document.getElementById('folder-name-input').value = '';
      document.getElementById('modal-folder').classList.remove('hidden');
    }

    function closeFolderModal() {
      document.getElementById('modal-folder').classList.add('hidden');
    }

    function handleSaveFolder() {
      const name = document.getElementById('folder-name-input').value.trim();
      if (!name) return;

      const newFolder = {
        id: "f-" + Date.now(),
        name: name,
        parentId: targetParentFolderId
      };

      folders.push(newFolder);
      saveToLocalStorage();
      closeFolderModal();
      renderTree();
    }

    // JSON保存
    function handleSaveImport() {
      const errorEl = document.getElementById('import-error');
      errorEl.classList.add('hidden');

      const jsonStr = document.getElementById('import-json').value.trim();
      let titleStr = document.getElementById('import-title').value.trim();
      const folderId = document.getElementById('import-folder-select').value || null;

      if (!jsonStr) {
        showError('JSONコードが入力されていません。');
        return;
      }

      try {
        const parsed = JSON.parse(jsonStr);

        if (!Array.isArray(parsed) || parsed.length === 0 || !parsed[0].chunks) {
          throw new Error('LLMのフォーマットと異なります。');
        }

        if (!titleStr) titleStr = `英文テキスト ${texts.length + 1}`;

        const newText = {
          id: "text-" + Date.now(),
          folderId: folderId,
          title: titleStr,
          data: parsed
        };

        texts.push(newText);
        currentTextId = newText.id;
        saveToLocalStorage();

        document.getElementById('import-title').value = '';
        document.getElementById('import-json').value = '';
        renderTree();
        switchView('reader');

      } catch (err) {
        showError('JSONコードの解析に失敗しました。ChatGPT等の出力をそのまま貼り付けてください。');
      }
    }

    function showError(msg) {
      const errorEl = document.getElementById('import-error');
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }

    // 削除処理
    function handleConfirmDelete() {
      if (!deleteTarget) return;

      if (deleteTarget.type === 'text') {
        texts = texts.filter(t => t.id !== deleteTarget.id);
        if (currentTextId === deleteTarget.id) {
          currentTextId = texts.length > 0 ? texts[0].id : null;
        }
      } else if (deleteTarget.type === 'folder') {
        // 対象フォルダおよびその配下のサブフォルダIDを再帰的に収集
        const folderIdsToDelete = [deleteTarget.id];
        function collectChildren(fid) {
          const subs = folders.filter(f => f.parentId === fid);
          subs.forEach(s => {
            folderIdsToDelete.push(s.id);
            collectChildren(s.id);
          });
        }
        collectChildren(deleteTarget.id);

        // 該当するフォルダおよびその配下のテキストを一括削除
        folders = folders.filter(f => !folderIdsToDelete.includes(f.id));
        texts = texts.filter(t => !folderIdsToDelete.includes(t.folderId));

        if (!texts.find(t => t.id === currentTextId)) {
          currentTextId = texts.length > 0 ? texts[0].id : null;
        }
      }

      saveToLocalStorage();
      document.getElementById('modal-delete').classList.add('hidden');
      deleteTarget = null;
      renderTree();
      renderReader();
    }
  </script>
</body>
</html>
