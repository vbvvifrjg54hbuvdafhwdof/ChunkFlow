<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChunkReader - スラッシュリーディング & 音読管理</title>

  <!-- PWA & アプリインストール設定 -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ChunkReader">

  <!-- iOS用 Apple Touch Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%234f46e5'/><path d='M25 38 C35 32, 45 37, 50 42 C55 37, 65 32, 75 38 L75 68 C65 62, 55 67, 50 72 C45 67, 35 62, 25 68 Z' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/><line x1='50' y1='42' x2='50' y2='72' stroke='white' stroke-width='6'/></svg>">

  <!-- インライン Web App Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"ChunkReader - スラッシュリーディング","short_name":"ChunkReader","description":"スラッシュリーディング＆音読管理アプリ","start_url":"./","scope":"./","display":"standalone","orientation":"portrait","background_color":"#f8fafc","theme_color":"#4f46e5","icons":[{"src":"data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" rx=\"28\" fill=\"%234f46e5\"/><path d=\"M25 38 C35 32, 45 37, 50 42 C55 37, 65 32, 75 38 L75 68 C65 62, 55 67, 50 72 C45 67, 35 62, 25 68 Z\" fill=\"none\" stroke=\"white\" stroke-width=\"6\" stroke-linejoin=\"round\"/><line x1=\"50\" y1=\"42\" x2=\"50\" y2=\"72\" stroke=\"white\" stroke-width=\"6\"/></svg>","sizes":"512x512","type":"image/svg+xml","purpose":"any maskable"}]}'>

  <!-- SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%234f46e5'/><path d='M25 38 C35 32, 45 37, 50 42 C55 37, 65 32, 75 38 L75 68 C65 62, 55 67, 50 72 C45 67, 35 62, 25 68 Z' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/><line x1='50' y1='42' x2='50' y2='72' stroke='white' stroke-width='6'/></svg>">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .chunk-touch {
      transition: background-color 0.1s ease;
    }
    .chunk-touch:active {
      background-color: #e0e7ff !important;
    }

    /* 英文と和訳を超密着させ、次の英文行を押し下げる見やすさ重視CSS */
    .sentence-block {
      display: block !important;
      margin-bottom: 1.2rem !important;
      line-height: 1.3 !important;
      word-break: break-word !important;
    }

    /* チャンク枠 */
    .chunk-box {
      position: relative !important;
      display: inline-block !important;
      max-width: 100% !important;
      vertical-align: top !important;
      margin-left: 2px !important;
      margin-right: 2px !important;
      margin-bottom: 0.85rem !important;
      padding: 0 2px !important;
      border-radius: 4px;
      box-sizing: border-box !important;
    }

    /* 和訳非表示モード時は下の余白を詰める */
    .mode-no-trans .chunk-box {
      margin-bottom: 0.2rem !important;
    }

    /* 英文本体 */
    .chunk-en {
      display: inline-block !important;
      max-width: 100% !important;
      white-space: normal !important;
      word-break: break-word !important;
      overflow-wrap: break-word !important;
      line-height: 1.2 !important;
    }

    /* 和訳（英文の1px直下に吸着） */
    .chunk-ja {
      position: absolute !important;
      top: 100% !important;
      left: 0 !important;
      width: 100% !important;
      margin-top: 1px !important;
      
      font-size: 0.62rem !important;
      line-height: 1.15 !important;
      color: #4f46e5 !important;
      font-weight: 500 !important;
      
      white-space: normal !important;
      word-break: break-all !important;
      overflow-wrap: break-word !important;
      
      pointer-events: none !important;
      z-index: 10 !important;
    }

    .slash-mark {
      display: inline-block !important;
      vertical-align: top !important;
      color: #a5b4fc !important;
      font-weight: 300 !important;
      margin: 0 2px !important;
      user-select: none !important;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col pb-20 md:pb-0 selection:bg-indigo-100">

  <!-- ヘッダー -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-3 py-2 flex flex-col gap-2">
      
      <!-- タイトル & ブランドアイコン -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-100">
            <i class="fa-solid fa-book-open text-xs"></i>
          </div>
          <h1 class="text-base font-bold tracking-tight text-slate-800">ChunkReader</h1>
          <!-- PWAインストールボタン -->
          <button id="btn-pwa-install" class="hidden px-2 py-0.5 bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-bold rounded-lg shadow-sm transition flex items-center gap-1 active:scale-95">
            <i class="fa-solid fa-download"></i> アプリ化
          </button>
        </div>
        <span id="header-folder-tag" class="text-[10px] bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full font-semibold truncate max-w-[160px]"></span>
      </div>

      <!-- コントロールバー -->
      <div id="toolbar-controls" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
        <button id="toggle-slash" class="flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 bg-white border border-slate-200 shadow-sm">
          <span class="font-bold text-indigo-500">/</span> スラッシュ
        </button>

        <button id="toggle-highlight" class="flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 bg-white border border-slate-200 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-rose-500"></span> 重要語
        </button>

        <div class="flex-shrink-0 flex bg-slate-100 p-0.5 rounded-lg text-xs font-semibold border border-slate-200/60">
          <button id="mode-tap" class="px-2 py-0.5 rounded-md transition bg-white text-indigo-600 shadow-sm">タップ</button>
          <button id="mode-all" class="px-2 py-0.5 rounded-md transition text-slate-500">全表示</button>
          <button id="mode-none" class="px-2 py-0.5 rounded-md transition text-slate-500">隠す</button>
        </div>

        <button id="toggle-raw" class="flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 border border-slate-200 text-slate-600 hover:bg-white">
          <i class="fa-solid fa-leaf text-emerald-500"></i> 白文
        </button>
      </div>

    </div>
  </header>

  <!-- メイン領域 -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-3 md:p-6">

    <!-- VIEW 1: 読解画面 -->
    <section id="view-reader" class="bg-white rounded-2xl p-4 md:p-8 shadow-sm border border-slate-200/60 min-h-[70vh] flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-5">
          <h2 id="current-title" class="text-lg md:text-xl font-bold text-slate-800 tracking-tight leading-snug"></h2>
          <button id="btn-open-delete" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition" title="削除">
            <i class="fa-solid fa-trash-can text-xs"></i>
          </button>
        </div>

        <!-- 英文チャンク表示領域 -->
        <div id="reader-content" class="text-base md:text-lg"></div>
      </div>

      <div id="empty-state" class="hidden text-center py-16">
        <i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i>
        <p class="text-xs text-slate-500 font-medium">文章が選択されていません。<br>「ライブラリ」から選択するか、追加してください。</p>
      </div>
    </section>

    <!-- VIEW 2: ライブラリ画面 -->
    <section id="view-library" class="bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-200/60 hidden space-y-5">
      <div class="flex flex-wrap items-center justify-between border-b border-slate-100 pb-3 gap-2">
        <h2 class="text-base font-bold text-slate-800">ライブラリ</h2>
        
        <div class="flex items-center gap-1.5">
          <button id="btn-export-data" class="py-1 px-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-lg transition flex items-center gap-1">
            <i class="fa-solid fa-download text-indigo-500"></i> バックアップ
          </button>
          <button id="btn-import-data" class="py-1 px-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-lg transition flex items-center gap-1">
            <i class="fa-solid fa-upload text-emerald-500"></i> 復元
          </button>
          <input type="file" id="file-input-backup" accept=".json" class="hidden">

          <button id="btn-add-root-folder" class="py-1 px-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold text-xs rounded-lg transition flex items-center gap-1">
            <i class="fa-solid fa-folder-plus"></i> 新規フォルダ
          </button>
        </div>
      </div>

      <div id="tree-container" class="space-y-1 text-sm"></div>
    </section>

    <!-- VIEW 3: JSON追加画面 -->
    <section id="view-import" class="bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-200/60 hidden space-y-5">
      <div class="border-b border-slate-100 pb-3">
        <h2 class="text-base font-bold text-slate-800">新しい英文（JSON）を登録</h2>
        <p class="text-[11px] text-slate-500 mt-0.5">LLMが出力したJSONコードを貼り付けてください。</p>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">保存先フォルダ</label>
          <select id="import-folder-select" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">タイトル（任意）</label>
          <input type="text" id="import-title" placeholder="例: 今日のニュース解説" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-base md:text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider">JSONコード</label>
            <button id="btn-paste-clipboard" type="button" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 px-2 py-1 bg-indigo-50 rounded-lg active:bg-indigo-100 transition">
              <i class="fa-solid fa-paste"></i> 貼り付け
            </button>
          </div>
          <textarea id="import-json" rows="8" placeholder='[&#10;  {&#10;    "sentence_id": 1,&#10;    "chunks": [ ... ]&#10;  }&#10;]' class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition"></textarea>
        </div>

        <div id="import-error" class="hidden p-2.5 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-600 font-medium"></div>
      </div>

      <div class="flex justify-end gap-2 pt-1">
        <button id="btn-cancel-import" type="button" class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold">キャンセル</button>
        <button id="btn-save-import" type="button" class="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold shadow-md shadow-indigo-100">登録して読む</button>
      </div>
    </section>

  </main>

  <!-- 下部固定ナビゲーションバー -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-200/80 z-40 px-6 py-2 flex justify-around items-center">
    <button id="nav-reader" class="flex flex-col items-center gap-0.5 text-indigo-600 font-bold transition">
      <i class="fa-solid fa-book-reader text-lg"></i>
      <span class="text-[10px]">読解</span>
    </button>
    <button id="nav-library" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition">
      <i class="fa-solid fa-folder-tree text-lg"></i>
      <span class="text-[10px]">ライブラリ</span>
    </button>
    <button id="nav-import" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition">
      <i class="fa-solid fa-square-plus text-lg"></i>
      <span class="text-[10px]">JSON追加</span>
    </button>
  </nav>

  <!-- モーダル類 -->
  <div id="modal-folder" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl border border-slate-100 space-y-3">
      <h3 id="modal-folder-title" class="text-sm font-bold text-slate-800">新しいフォルダを作成</h3>
      <input type="text" id="folder-name-input" placeholder="フォルダ名を入力" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-base md:text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
      <div class="flex justify-end gap-2 pt-1">
        <button id="btn-cancel-folder" class="px-3 py-1.5 rounded-lg text-slate-600 text-xs font-semibold">キャンセル</button>
        <button id="btn-save-folder" class="px-4 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold">作成</button>
      </div>
    </div>
  </div>

  <div id="modal-delete" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl border border-slate-100 space-y-4 text-center">
      <div class="w-10 h-10 bg-rose-50 text-rose-500 rounded-xl flex items-center justify-center mx-auto text-lg">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div class="space-y-1">
        <h3 id="delete-modal-heading" class="text-base font-bold text-slate-800">削除しますか？</h3>
        <p id="delete-target-title" class="text-xs text-slate-500 font-medium break-words"></p>
      </div>
      <div class="flex justify-center gap-2 pt-1">
        <button id="btn-cancel-delete" class="w-1/2 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold">キャンセル</button>
        <button id="btn-confirm-delete" class="w-1/2 py-2 rounded-xl bg-rose-600 text-white text-xs font-semibold">削除</button>
      </div>
    </div>
  </div>

  <!-- アプリJSロジック -->
  <script>
    // Service Worker 登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => self.clients.claim());
          self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }

    // PWA インストールプロンプト制御
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('btn-pwa-install');
      if (installBtn) installBtn.classList.remove('hidden');
    });

    const SAMPLE_FOLDERS = [
      { id: "f-1", name: "ニュース・IT", parentId: null },
      { id: "f-2", name: "人工知能 (AI)", parentId: "f-1" }
    ];

    const SAMPLE_TEXTS = [
      {
        id: "text-1",
        folderId: "f-2",
        title: "サンプル：AIと将来の仕事",
        data: [
          {
            "sentence_id": 1,
            "chunks": [
              { "en": "In recent years,", "is_important": false, "ja": "近年、" },
              { "en": "artificial intelligence has advanced", "is_important": false, "ja": "人工知能は進化してきた" },
              { "en": "at an unprecedented speed,", "is_important": false, "ja": "前例のない速度で、" },
              { "en": "changing the way", "is_important": false, "ja": "〜という方法を変えながら" },
              { "en": "we live and work.", "is_important": false, "ja": "私たちが生活し働く（方法を）。" }
            ]
          },
          {
            "sentence_id": 2,
            "chunks": [
              { "en": "Although many experts predict", "is_important": true, "ja": "多くの専門家は〜と予測しているが、" },
              { "en": "that AI will automate routine tasks", "is_important": false, "ja": "AIが定型業務を自動化し" },
              { "en": "and increase productivity,", "is_important": false, "ja": "生産性を高めると（予測しているが）、" },
              { "en": "others worry", "is_important": false, "ja": "ほかの人々は懸念している" },
              { "en": "that it could lead to", "is_important": false, "ja": "それが〜につながる可能性があると" },
              { "en": "widespread job loss.", "is_important": false, "ja": "広範な雇用喪失に。" }
            ]
          },
          {
            "sentence_id": 3,
            "chunks": [
              { "en": "However,", "is_important": true, "ja": "しかしながら、" },
              { "en": "history shows", "is_important": false, "ja": "歴史が示しているのは" },
              { "en": "that technological revolutions", "is_important": false, "ja": "技術革命が" },
              { "en": "usually create new types of jobs", "is_important": false, "ja": "通常、新しい種類の仕事を生み出すということだ" },
              { "en": "while destroying old ones.", "is_important": true, "ja": "古いものを破壊する一方で。" }
            ]
          },
          {
            "sentence_id": 4,
            "chunks": [
              { "en": "For instance,", "is_important": true, "ja": "例えば、" },
              { "en": "while traditional manufacturing jobs have declined,", "is_important": true, "ja": "従来の製造業の仕事が減少した一方で、" },
              { "en": "demand for software engineers and data analysts", "is_important": false, "ja": "ソフトウェアエンジニアやデータアナリストの需要は" },
              { "en": "has skyrocketed.", "is_important": false, "ja": "急増した。" }
            ]
          },
          {
            "sentence_id": 5,
            "chunks": [
              { "en": "In addition,", "is_important": true, "ja": "さらに、" },
              { "en": "lifelong learning will become essential", "is_important": false, "ja": "生涯学習が不可欠になるだろう" },
              { "en": "for workers.", "is_important": false, "ja": "労働者にとって。" }
            ]
          }
        ]
      }
    ];

    let folders = [];
    let texts = [];
    let currentTextId = null;
    let targetParentFolderId = null;
    let deleteTarget = null;
    let expandedFolderIds = new Set();
    let isTreeInit = false;

    // 前回選択したフォルダの記憶
    let lastSelectedFolderId = localStorage.getItem('chunk_reader_last_folder_v5') || "";

    let config = {
      showSlash: true,
      showHighlight: true,
      transMode: 'tap',
      isRaw: false
    };
    let tappedChunks = {};

    document.addEventListener('DOMContentLoaded', () => {
      try {
        const storedFolders = localStorage.getItem('chunk_reader_folders_v5');
        const storedTexts = localStorage.getItem('chunk_reader_texts_v5');

        if (storedFolders && storedTexts) {
          folders = JSON.parse(storedFolders);
          texts = JSON.parse(storedTexts);
        }
      } catch (e) {
        console.error("データ読み込みエラー:", e);
        folders = [];
        texts = [];
      }

      if (!Array.isArray(folders) || folders.length === 0 || !Array.isArray(texts) || texts.length === 0) {
        folders = JSON.parse(JSON.stringify(SAMPLE_FOLDERS));
        texts = JSON.parse(JSON.stringify(SAMPLE_TEXTS));
        saveToLocalStorage();
      }

      if (texts.length > 0) currentTextId = texts[0].id;

      setupEventListeners();
      updateToggleStyles();
      renderTree();
      switchView('reader');
    });

    function saveToLocalStorage() {
      localStorage.setItem('chunk_reader_folders_v5', JSON.stringify(folders));
      localStorage.setItem('chunk_reader_texts_v5', JSON.stringify(texts));
    }

    function switchView(viewName) {
      document.getElementById('view-reader').classList.toggle('hidden', viewName !== 'reader');
      document.getElementById('view-library').classList.toggle('hidden', viewName !== 'library');
      document.getElementById('view-import').classList.toggle('hidden', viewName !== 'import');

      document.getElementById('toolbar-controls').style.display = (viewName === 'reader') ? 'flex' : 'none';

      const navs = {
        reader: document.getElementById('nav-reader'),
        library: document.getElementById('nav-library'),
        import: document.getElementById('nav-import')
      };

      Object.keys(navs).forEach(key => {
        if (key === viewName) {
          navs[key].className = "flex flex-col items-center gap-0.5 text-indigo-600 font-bold transition";
        } else {
          navs[key].className = "flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition font-normal";
        }
      });

      if (viewName === 'reader') renderReader();
      if (viewName === 'library') renderTree();
      if (viewName === 'import') renderFolderSelectOptions();
    }

    function setupEventListeners() {
      // PWAインストールボタンクリック
      document.getElementById('btn-pwa-install').onclick = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            document.getElementById('btn-pwa-install').classList.add('hidden');
          }
          deferredPrompt = null;
        }
      };

      document.getElementById('nav-reader').onclick = () => switchView('reader');
      document.getElementById('nav-library').onclick = () => switchView('library');
      document.getElementById('nav-import').onclick = () => switchView('import');
      document.getElementById('btn-cancel-import').onclick = () => switchView('reader');

      document.getElementById('btn-add-root-folder').onclick = () => openFolderModal(null);
      document.getElementById('btn-cancel-folder').onclick = closeFolderModal;
      document.getElementById('btn-save-folder').onclick = handleSaveFolder;

      document.getElementById('btn-export-data').onclick = handleExportData;
      document.getElementById('btn-import-data').onclick = () => document.getElementById('file-input-backup').click();
      document.getElementById('file-input-backup').onchange = handleImportBackupFile;

      // 保存先フォルダの手動変更を記憶
      document.getElementById('import-folder-select').addEventListener('change', (e) => {
        lastSelectedFolderId = e.target.value;
        localStorage.setItem('chunk_reader_last_folder_v5', lastSelectedFolderId);
      });

      document.getElementById('btn-paste-clipboard').onclick = async () => {
        try {
          const text = await navigator.clipboard.readText();
          document.getElementById('import-json').value = text;
        } catch (err) {
          alert('クリップボードの読み取りに対応していません。手動で貼り付けてください。');
        }
      };

      document.getElementById('toggle-slash').onclick = () => {
        config.showSlash = !config.showSlash;
        updateToggleStyles();
        renderReader();
      };

      document.getElementById('toggle-highlight').onclick = () => {
        config.showHighlight = !config.showHighlight;
        updateToggleStyles();
        renderReader();
      };

      document.getElementById('toggle-raw').onclick = () => {
        config.isRaw = !config.isRaw;
        updateToggleStyles();
        renderReader();
      };

      ['tap', 'all', 'none'].forEach(mode => {
        document.getElementById(`mode-${mode}`).onclick = () => {
          config.transMode = mode;
          tappedChunks = {};
          updateToggleStyles();
          renderReader();
        };
      });

      document.getElementById('btn-save-import').onclick = handleSaveImport;

      document.getElementById('btn-open-delete').onclick = () => {
        const activeText = texts.find(t => t.id === currentTextId);
        if (!activeText) return;
        deleteTarget = { type: 'text', id: activeText.id };
        document.getElementById('delete-modal-heading').textContent = "文章を削除しますか？";
        document.getElementById('delete-target-title').textContent = `「${activeText.title}」`;
        document.getElementById('modal-delete').classList.remove('hidden');
      };

      document.getElementById('btn-cancel-delete').onclick = () => document.getElementById('modal-delete').classList.add('hidden');
      document.getElementById('btn-confirm-delete').onclick = handleConfirmDelete;
    }

    function updateToggleStyles() {
      const slashBtn = document.getElementById('toggle-slash');
      slashBtn.className = config.showSlash
        ? "flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 bg-white border border-indigo-200 text-indigo-700 shadow-sm"
        : "flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 border border-slate-200 text-slate-400";

      const hlBtn = document.getElementById('toggle-highlight');
      hlBtn.className = config.showHighlight
        ? "flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 bg-white border border-rose-200 text-rose-700 shadow-sm"
        : "flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 border border-slate-200 text-slate-400";

      const rawBtn = document.getElementById('toggle-raw');
      rawBtn.className = config.isRaw
        ? "flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 bg-emerald-500 text-white shadow-sm"
        : "flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 border border-slate-200 text-slate-600";

      ['tap', 'all', 'none'].forEach(mode => {
        const btn = document.getElementById(`mode-${mode}`);
        if (config.transMode === mode) {
          btn.className = "px-2 py-0.5 rounded-md transition bg-white text-indigo-600 font-bold shadow-sm";
        } else {
          btn.className = "px-2 py-0.5 rounded-md transition text-slate-500 font-medium";
        }
      });
    }

    // ライブラリ画面の階層ツリー描画
    function renderTree() {
      const container = document.getElementById('tree-container');
      container.innerHTML = '';

      if (!isTreeInit && folders.length > 0) {
        folders.forEach(f => expandedFolderIds.add(f.id));
        isTreeInit = true;
      }

      function buildFolderTree(parentId, level) {
        const ul = document.createElement('ul');
        ul.className = level > 0 ? "pl-4 ml-3 border-l-2 border-slate-200/80 space-y-1 my-1" : "space-y-1";

        const subFolders = folders.filter(f => f.parentId === parentId);
        subFolders.forEach(f => {
          const li = document.createElement('li');
          const isExpanded = expandedFolderIds.has(f.id);

          const childTextCount = texts.filter(t => t.folderId === f.id).length;
          const childFolderCount = folders.filter(sub => sub.parentId === f.id).length;
          const totalItems = childTextCount + childFolderCount;

          const folderHeader = document.createElement('div');
          folderHeader.className = "flex items-center justify-between p-2.5 rounded-xl text-slate-700 bg-slate-100/80 hover:bg-slate-200/60 font-semibold cursor-pointer transition select-none group";
          
          folderHeader.innerHTML = `
            <div class="flex items-center gap-2 truncate">
              <i class="fa-solid ${isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'} text-slate-400 text-xs w-3"></i>
              <i class="fa-solid ${isExpanded ? 'fa-folder-open text-amber-500' : 'fa-folder text-amber-400'} text-base"></i>
              <span class="truncate text-sm text-slate-800 font-bold">${f.name}</span>
              <span class="text-[10px] font-medium text-slate-400 bg-white/80 px-2 py-0.5 rounded-full border border-slate-200/60">${totalItems}件</span>
            </div>
            <div class="flex items-center gap-1">
              <button title="サブフォルダ追加" class="btn-add-sub p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-white rounded-lg transition"><i class="fa-solid fa-plus text-xs"></i></button>
              <button title="フォルダ削除" class="btn-del-folder p-1.5 text-slate-400 hover:text-rose-600 hover:bg-white rounded-lg transition"><i class="fa-solid fa-trash-can text-xs"></i></button>
            </div>
          `;

          folderHeader.onclick = (e) => {
            if (expandedFolderIds.has(f.id)) {
              expandedFolderIds.delete(f.id);
            } else {
              expandedFolderIds.add(f.id);
            }
            renderTree();
          };

          folderHeader.querySelector('.btn-add-sub').onclick = (e) => {
            e.stopPropagation();
            openFolderModal(f.id);
          };

          folderHeader.querySelector('.btn-del-folder').onclick = (e) => {
            e.stopPropagation();
            deleteTarget = { type: 'folder', id: f.id };
            document.getElementById('delete-modal-heading').textContent = "フォルダを削除しますか？";
            document.getElementById('delete-target-title').textContent = `「${f.name}」とその中身の全データ`;
            document.getElementById('modal-delete').classList.remove('hidden');
          };

          li.appendChild(folderHeader);

          if (isExpanded) {
            li.appendChild(buildFolderTree(f.id, level + 1));
          }
          ul.appendChild(li);
        });

        const childTexts = texts.filter(t => t.folderId === parentId);
        childTexts.forEach(t => {
          const li = document.createElement('li');
          const isActive = t.id === currentTextId;
          li.className = `p-2 px-3 rounded-xl cursor-pointer transition flex items-center justify-between gap-2.5 ${
            isActive ? 'bg-indigo-600 text-white font-bold shadow-sm shadow-indigo-200' : 'text-slate-700 hover:bg-slate-100/80 bg-white border border-slate-200/50'
          }`;
          li.innerHTML = `
            <div class="flex items-center gap-2.5 truncate min-w-0">
              <i class="fa-regular fa-file-lines ${isActive ? 'text-indigo-200' : 'text-slate-400'} text-xs flex-shrink-0"></i>
              <span class="truncate text-xs md:text-sm font-medium tracking-tight">${t.title}</span>
            </div>
            <button title="文章削除" class="btn-del-text p-1.5 ${isActive ? 'text-indigo-200 hover:text-white hover:bg-indigo-500/50' : 'text-slate-400 hover:text-rose-600 hover:bg-slate-100'} rounded-lg transition flex-shrink-0">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          `;
          li.onclick = (e) => {
            e.stopPropagation();
            currentTextId = t.id;
            tappedChunks = {};
            renderTree();
            switchView('reader');
          };

          const delBtn = li.querySelector('.btn-del-text');
          if (delBtn) {
            delBtn.onclick = (e) => {
              e.stopPropagation();
              deleteTarget = { type: 'text', id: t.id };
              document.getElementById('delete-modal-heading').textContent = "文章を削除しますか？";
              document.getElementById('delete-target-title').textContent = `「${t.title}」`;
              document.getElementById('modal-delete').classList.remove('hidden');
            };
          }

          ul.appendChild(li);
        });

        return ul;
      }

      container.appendChild(buildFolderTree(null, 0));
    }

    // JSON追加用のフォルダ選択肢描画（前回選択したフォルダの復元対応）
    function renderFolderSelectOptions() {
      const select = document.getElementById('import-folder-select');
      select.innerHTML = '<option value="">(ルート / フォルダなし)</option>';

      function addOptions(parentId, prefix) {
        const sub = folders.filter(f => f.parentId === parentId);
        sub.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.id;
          opt.textContent = prefix + f.name;
          select.appendChild(opt);
          addOptions(f.id, prefix + "　");
        });
      }
      addOptions(null, "📂 ");

      // 前回選択されたフォルダが存在すれば自動的にそれを初期選択する
      if (lastSelectedFolderId && Array.from(select.options).some(opt => opt.value === lastSelectedFolderId)) {
        select.value = lastSelectedFolderId;
      } else {
        select.value = "";
      }
    }

    function getFolderPath(folderId) {
      if (!folderId) return "ルート";
      const path = [];
      let curr = folders.find(f => f.id === folderId);
      while (curr) {
        path.unshift(curr.name);
        curr = folders.find(f => f.id === curr.parentId);
      }
      return path.join(' / ');
    }

    function renderReader() {
      const activeText = texts.find(t => t.id === currentTextId);
      const readerContent = document.getElementById('reader-content');
      const currentTitleEl = document.getElementById('current-title');
      const headerFolderTag = document.getElementById('header-folder-tag');
      const emptyState = document.getElementById('empty-state');

      if (!activeText) {
        currentTitleEl.textContent = "文章がありません";
        headerFolderTag.textContent = "";
        readerContent.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      currentTitleEl.textContent = activeText.title;
      headerFolderTag.textContent = getFolderPath(activeText.folderId);
      readerContent.innerHTML = '';

      if (config.isRaw) {
        const p = document.createElement('p');
        p.className = "text-slate-800 leading-relaxed font-normal tracking-wide";
        const fullText = activeText.data
          .map(s => s.chunks.map(c => c.en).join(' '))
          .join(' ');
        p.textContent = fullText;
        readerContent.appendChild(p);
        return;
      }

      const isNoTrans = config.transMode === 'none';
      if (isNoTrans) {
        readerContent.classList.add('mode-no-trans');
      } else {
        readerContent.classList.remove('mode-no-trans');
      }

      activeText.data.forEach((sentence, sIdx) => {
        const sentenceDiv = document.createElement('div');
        sentenceDiv.className = "sentence-block";

        sentence.chunks.forEach((chunk, cIdx) => {
          const chunkKey = `${sIdx}-${cIdx}`;
          const isLastChunk = cIdx === sentence.chunks.length - 1;

          const chunkWrap = document.createElement('div');
          chunkWrap.className = "chunk-box chunk-touch cursor-pointer";
          
          chunkWrap.onclick = () => {
            if (config.transMode === 'tap') {
              tappedChunks[chunkKey] = !tappedChunks[chunkKey];
              renderReader();
            }
          };

          const enSpan = document.createElement('span');
          enSpan.className = "chunk-en select-none tracking-wide text-slate-800";
          
          if (config.showHighlight && chunk.is_important) {
            const words = chunk.en.split(' ');
            if (words.length > 0) {
              const firstWord = words[0];
              const restWords = words.slice(1).join(' ');

              const redWordSpan = document.createElement('span');
              redWordSpan.className = "text-rose-600 font-semibold bg-rose-50 px-1 rounded";
              redWordSpan.textContent = firstWord;

              enSpan.appendChild(redWordSpan);
              if (restWords) {
                enSpan.appendChild(document.createTextNode(' ' + restWords));
              }
            } else {
              enSpan.textContent = chunk.en;
            }
          } else {
            enSpan.textContent = chunk.en;
          }

          chunkWrap.appendChild(enSpan);

          let showJa = false;
          if (config.transMode === 'all') showJa = true;
          if (config.transMode === 'tap' && tappedChunks[chunkKey]) showJa = true;

          if (showJa && chunk.ja) {
            const jaSpan = document.createElement('span');
            jaSpan.className = "chunk-ja";
            jaSpan.textContent = chunk.ja;
            chunkWrap.appendChild(jaSpan);
          }

          sentenceDiv.appendChild(chunkWrap);

          if (config.showSlash && !isLastChunk) {
            const slashSpan = document.createElement('span');
            slashSpan.className = "slash-mark";
            slashSpan.textContent = "/";
            sentenceDiv.appendChild(slashSpan);
          }
        });

        readerContent.appendChild(sentenceDiv);
      });
    }

    function openFolderModal(parentId) {
      targetParentFolderId = parentId;
      document.getElementById('modal-folder-title').textContent = parentId ? "サブフォルダを追加" : "新しいフォルダを作成";
      document.getElementById('folder-name-input').value = '';
      document.getElementById('modal-folder').classList.remove('hidden');
    }

    function closeFolderModal() {
      document.getElementById('modal-folder').classList.add('hidden');
    }

    function handleSaveFolder() {
      const name = document.getElementById('folder-name-input').value.trim();
      if (!name) return;

      const newFolder = {
        id: "f-" + Date.now(),
        name: name,
        parentId: targetParentFolderId
      };

      folders.push(newFolder);
      expandedFolderIds.add(newFolder.id);
      saveToLocalStorage();
      closeFolderModal();
      renderTree();
    }

    function handleSaveImport() {
      const errorEl = document.getElementById('import-error');
      errorEl.classList.add('hidden');

      const jsonStr = document.getElementById('import-json').value.trim();
      let titleStr = document.getElementById('import-title').value.trim();
      const folderId = document.getElementById('import-folder-select').value || null;

      if (!jsonStr) {
        showError('JSONコードが入力されていません。');
        return;
      }

      try {
        const parsed = JSON.parse(jsonStr);

        if (!Array.isArray(parsed) || parsed.length === 0 || !parsed[0].chunks) {
          throw new Error('LLMのフォーマットと異なります。');
        }

        if (!titleStr) titleStr = `英文テキスト ${texts.length + 1}`;

        const newText = {
          id: "text-" + Date.now(),
          folderId: folderId,
          title: titleStr,
          data: parsed
        };

        texts.push(newText);
        currentTextId = newText.id;
        if (folderId) expandedFolderIds.add(folderId);

        // 登録成功時に選択フォルダを記憶
        lastSelectedFolderId = folderId || "";
        localStorage.setItem('chunk_reader_last_folder_v5', lastSelectedFolderId);

        saveToLocalStorage();

        document.getElementById('import-title').value = '';
        document.getElementById('import-json').value = '';
        renderTree();
        switchView('reader');

      } catch (err) {
        showError('JSONの解析に失敗しました。ChatGPT等の出力をそのまま貼り付けてください。');
      }
    }

    function showError(msg) {
      const errorEl = document.getElementById('import-error');
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }

    function handleConfirmDelete() {
      if (!deleteTarget) return;

      if (deleteTarget.type === 'text') {
        texts = texts.filter(t => t.id !== deleteTarget.id);
        if (currentTextId === deleteTarget.id) {
          currentTextId = texts.length > 0 ? texts[0].id : null;
        }
      } else if (deleteTarget.type === 'folder') {
        const folderIdsToDelete = [deleteTarget.id];
        function collectChildren(fid) {
          const subs = folders.filter(f => f.parentId === fid);
          subs.forEach(s => {
            folderIdsToDelete.push(s.id);
            collectChildren(s.id);
          });
        }
        collectChildren(deleteTarget.id);

        folders = folders.filter(f => !folderIdsToDelete.includes(f.id));
        texts = texts.filter(t => !folderIdsToDelete.includes(t.folderId));

        if (!texts.find(t => t.id === currentTextId)) {
          currentTextId = texts.length > 0 ? texts[0].id : null;
        }
      }

      saveToLocalStorage();
      document.getElementById('modal-delete').classList.add('hidden');
      deleteTarget = null;
      renderTree();
      renderReader();
    }

    function handleExportData() {
      const backupData = {
        version: "5.0",
        exportDate: new Date().toISOString(),
        folders: folders,
        texts: texts
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `chunk_reader_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function handleImportBackupFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.folders && imported.texts) {
            folders = imported.folders;
            texts = imported.texts;
            if (texts.length > 0) currentTextId = texts[0].id;
            saveToLocalStorage();
            renderTree();
            renderReader();
            alert('データを無事に復元しました！');
          } else {
            alert('有効なバックアップファイルではありません。');
          }
        } catch (err) {
          alert('ファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
