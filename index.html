<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChunkReader - スラッシュリーディング & 音読管理</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .chunk-hover {
      transition: all 0.15s ease;
    }
    .chunk-hover:hover {
      background-color: rgba(238, 242, 255, 0.7);
      transform: translateY(-1px);
    }
    .animate-pop {
      animation: pop 0.15s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.96); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー / ツールバー -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      
      <!-- ロゴ & モバイルメニュー -->
      <div class="flex items-center space-x-3">
        <button id="btn-toggle-sidebar" class="md:hidden text-slate-500 hover:text-slate-800 p-1.5 rounded-lg hover:bg-slate-100 transition">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-200">
            <i class="fa-solid fa-book-open text-base"></i>
          </div>
          <h1 class="text-xl font-bold tracking-tight text-slate-800">ChunkReader</h1>
        </div>
      </div>

      <!-- 表示コントロール -->
      <div class="flex flex-wrap items-center gap-2 sm:gap-3 bg-slate-100/80 p-1.5 rounded-2xl border border-slate-200/60 shadow-inner">
        
        <!-- スラッシュ ON/OFF -->
        <button id="toggle-slash" class="px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all flex items-center gap-1.5">
          <span class="text-sm font-bold text-indigo-500">/</span> スラッシュ
        </button>

        <!-- 赤字ハイライト ON/OFF -->
        <button id="toggle-highlight" class="px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span> 重要語
        </button>

        <!-- 和訳モード切替 -->
        <div class="flex bg-slate-200/70 p-0.5 rounded-xl text-xs font-semibold">
          <button id="mode-tap" class="px-3 py-1.5 rounded-lg transition-all">タップ表示</button>
          <button id="mode-all" class="px-3 py-1.5 rounded-lg transition-all text-slate-500 hover:text-slate-800">全表示</button>
          <button id="mode-none" class="px-3 py-1.5 rounded-lg transition-all text-slate-500 hover:text-slate-800">非表示</button>
        </div>

        <!-- 白文（Raw）モード -->
        <button id="toggle-raw" class="px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all flex items-center gap-1.5 border border-slate-200 text-slate-600 hover:bg-white">
          <i class="fa-solid fa-leaf text-emerald-500 text-xs"></i> 白文
        </button>
      </div>

    </div>
  </header>

  <!-- メインレイアウト -->
  <div class="flex-1 flex max-w-7xl w-full mx-auto">
    
    <!-- サイドバー：登録英文一覧 -->
    <aside id="sidebar" class="w-80 bg-white border-r border-slate-200/80 flex-shrink-0 flex flex-col justify-between hidden md:flex transition-all">
      <div class="p-5">
        <button id="btn-open-import" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold text-sm rounded-xl shadow-md shadow-indigo-100 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus text-xs"></i> 新しい英文を追加
        </button>

        <div class="mt-8">
          <h2 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-2 mb-3">マイライブラリ</h2>
          <ul id="text-list" class="space-y-1.5">
            <!-- 英文リスト -->
          </ul>
        </div>
      </div>
      <div class="p-4 border-t border-slate-100 text-[11px] text-slate-400 text-center font-medium">
        データはブラウザ内に自動保存されます
      </div>
    </aside>

    <!-- メイン読解エリア -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
      <div class="max-w-4xl mx-auto bg-white rounded-3xl p-6 md:p-12 shadow-sm border border-slate-200/60 min-h-[550px] flex flex-col justify-between">
        
        <div>
          <!-- 文章ヘッダー -->
          <div class="flex items-center justify-between border-b border-slate-100 pb-5 mb-8">
            <h2 id="current-title" class="text-xl md:text-2xl font-bold text-slate-800 tracking-tight">
              <!-- タイトル -->
            </h2>
            <button id="btn-open-delete" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition" title="この文章を削除">
              <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
          </div>

          <!-- 英文表示領域 -->
          <div id="reader-content" class="space-y-8 text-lg md:text-xl leading-relaxed">
            <!-- チャンクコンテンツ -->
          </div>
        </div>

        <!-- 空状態のプレースホルダー -->
        <div id="empty-state" class="hidden text-center py-20">
          <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
          <p class="text-slate-500 font-medium">文章がありません</p>
        </div>

      </div>
    </main>

  </div>

  <!-- 【モーダル 1】インポート画面 (生英文 / JSON 共通) -->
  <div id="modal-import" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl max-w-xl w-full p-6 md:p-8 shadow-2xl border border-slate-100 space-y-5 animate-pop">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-slate-800 tracking-tight">新しい英文を追加</h3>
        <button id="btn-close-import" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-100 transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">タイトル（省略可）</label>
          <input type="text" id="import-title" placeholder="例: 今日のニュース" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm font-medium transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">
            英文（生の英文・LLMのJSONどちらでも貼り付け可能）
          </label>
          <textarea id="import-text" rows="7" placeholder="生の英文をそのまま貼り付けるか、LLMが出力したJSONコードを貼り付けてください。" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button id="btn-cancel-import" class="px-5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-semibold transition">キャンセル</button>
        <button id="btn-save-import" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-md shadow-indigo-100 transition">登録する</button>
      </div>
    </div>
  </div>

  <!-- 【モーダル 2】二重確認用 削除ダイアログ -->
  <div id="modal-delete" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl border border-slate-100 space-y-6 animate-pop text-center">
      <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div class="space-y-2">
        <h3 class="text-lg font-bold text-slate-800">本当に削除しますか？</h3>
        <p id="delete-target-title" class="text-sm text-slate-500 font-medium px-4 break-words"></p>
        <p class="text-xs text-rose-500 font-medium">この操作は取り消せません。</p>
      </div>
      <div class="flex justify-center gap-3 pt-2">
        <button id="btn-cancel-delete" class="w-1/2 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 text-sm font-semibold transition">キャンセル</button>
        <button id="btn-confirm-delete" class="w-1/2 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold shadow-md shadow-rose-100 transition">削除実行</button>
      </div>
    </div>
  </div>

  <!-- アプリJSロジック -->
  <script>
    // 初期サンプルデータ
    const SAMPLE_DATA = {
      id: "sample-1",
      title: "サンプル：AIと将来の仕事",
      data: [
        {
          "sentence_id": 1,
          "chunks": [
            { "en": "In recent years,", "is_important": false, "ja": "近年、" },
            { "en": "artificial intelligence has advanced", "is_important": false, "ja": "人工知能は進化してきた" },
            { "en": "at an unprecedented speed,", "is_important": false, "ja": "前例のない速度で、" },
            { "en": "changing the way", "is_important": false, "ja": "〜という方法を変えながら" },
            { "en": "we live and work.", "is_important": false, "ja": "私たちが生活し働く（方法を）。" }
          ]
        },
        {
          "sentence_id": 2,
          "chunks": [
            { "en": "Although many experts predict", "is_important": true, "ja": "多くの専門家は〜と予測しているが、" },
            { "en": "that AI will automate routine tasks", "is_important": false, "ja": "AIが定型業務を自動化し" },
            { "en": "and increase productivity,", "is_important": false, "ja": "生産性を高めると（予測しているが）、" },
            { "en": "others worry", "is_important": false, "ja": "ほかの人々は懸念している" },
            { "en": "that it could lead to", "is_important": false, "ja": "それが〜につながる可能性があると" },
            { "en": "widespread job loss.", "is_important": false, "ja": "広範な雇用喪失に。" }
          ]
        },
        {
          "sentence_id": 3,
          "chunks": [
            { "en": "However,", "is_important": true, "ja": "しかしながら、" },
            { "en": "history shows", "is_important": false, "ja": "歴史が示しているのは" },
            { "en": "that technological revolutions", "is_important": false, "ja": "技術革命が" },
            { "en": "usually create new types of jobs", "is_important": false, "ja": "通常、新しい種類の仕事を生み出すということだ" },
            { "en": "while destroying old ones.", "is_important": true, "ja": "古いものを破壊する一方で。" }
          ]
        }
      ]
    };

    let texts = [];
    let currentTextId = null;
    let config = {
      showSlash: true,
      showHighlight: true,
      transMode: 'tap',
      isRaw: false
    };
    let tappedChunks = {};

    document.addEventListener('DOMContentLoaded', () => {
      const stored = localStorage.getItem('chunk_reader_texts_v3');
      if (stored) {
        texts = JSON.parse(stored);
      } else {
        texts = [SAMPLE_DATA];
        saveToLocalStorage();
      }
      if (texts.length > 0) currentTextId = texts[0].id;

      setupEventListeners();
      updateToggleStyles();
      renderSidebar();
      renderReader();
    });

    function saveToLocalStorage() {
      localStorage.setItem('chunk_reader_texts_v3', JSON.stringify(texts));
    }

    function setupEventListeners() {
      document.getElementById('toggle-slash').onclick = () => {
        config.showSlash = !config.showSlash;
        updateToggleStyles();
        renderReader();
      };

      document.getElementById('toggle-highlight').onclick = () => {
        config.showHighlight = !config.showHighlight;
        updateToggleStyles();
        renderReader();
      };

      document.getElementById('toggle-raw').onclick = () => {
        config.isRaw = !config.isRaw;
        updateToggleStyles();
        renderReader();
      };

      ['tap', 'all', 'none'].forEach(mode => {
        document.getElementById(`mode-${mode}`).onclick = () => {
          config.transMode = mode;
          tappedChunks = {};
          updateToggleStyles();
          renderReader();
        };
      });

      const modalImport = document.getElementById('modal-import');
      document.getElementById('btn-open-import').onclick = () => modalImport.classList.remove('hidden');
      document.getElementById('btn-close-import').onclick = () => modalImport.classList.add('hidden');
      document.getElementById('btn-cancel-import').onclick = () => modalImport.classList.add('hidden');
      document.getElementById('btn-save-import').onclick = handleImport;

      const modalDelete = document.getElementById('modal-delete');
      document.getElementById('btn-open-delete').onclick = () => {
        const activeText = texts.find(t => t.id === currentTextId);
        if (!activeText) return;
        document.getElementById('delete-target-title').textContent = `「${activeText.title}」`;
        modalDelete.classList.remove('hidden');
      };
      document.getElementById('btn-cancel-delete').onclick = () => modalDelete.classList.add('hidden');
      document.getElementById('btn-confirm-delete').onclick = () => {
        modalDelete.classList.add('hidden');
        handleDeleteText();
      };

      document.getElementById('btn-toggle-sidebar').onclick = () => {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('hidden');
        sidebar.classList.toggle('absolute');
        sidebar.classList.toggle('z-40');
        sidebar.classList.toggle('h-full');
      };
    }

    function updateToggleStyles() {
      const slashBtn = document.getElementById('toggle-slash');
      slashBtn.className = config.showSlash
        ? "px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all bg-white text-slate-800 shadow-sm border border-slate-200/80"
        : "px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all text-slate-400 hover:text-slate-600";

      const hlBtn = document.getElementById('toggle-highlight');
      hlBtn.className = config.showHighlight
        ? "px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all bg-white text-slate-800 shadow-sm border border-slate-200/80"
        : "px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all text-slate-400 hover:text-slate-600";

      const rawBtn = document.getElementById('toggle-raw');
      rawBtn.className = config.isRaw
        ? "px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all bg-emerald-500 text-white shadow-md shadow-emerald-100"
        : "px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all border border-slate-200 text-slate-600 hover:bg-white";

      ['tap', 'all', 'none'].forEach(mode => {
        const btn = document.getElementById(`mode-${mode}`);
        if (config.transMode === mode) {
          btn.className = "px-3 py-1.5 rounded-lg transition-all bg-white text-indigo-600 font-bold shadow-sm";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg transition-all text-slate-500 hover:text-slate-800 font-medium";
        }
      });
    }

    function renderSidebar() {
      const textListEl = document.getElementById('text-list');
      textListEl.innerHTML = '';
      
      texts.forEach(t => {
        const li = document.createElement('li');
        const isActive = t.id === currentTextId;
        li.className = `px-3.5 py-3 rounded-2xl cursor-pointer text-xs font-semibold transition-all flex items-center justify-between ${
          isActive ? 'bg-indigo-50/80 text-indigo-700 shadow-sm border border-indigo-100' : 'text-slate-600 hover:bg-slate-50'
        }`;
        li.innerHTML = `
          <span class="truncate pr-2">${t.title}</span>
          ${isActive ? '<i class="fa-solid fa-angle-right text-indigo-500"></i>' : ''}
        `;
        li.onclick = () => {
          currentTextId = t.id;
          tappedChunks = {};
          renderSidebar();
          renderReader();
        };
        textListEl.appendChild(li);
      });
    }

    function renderReader() {
      const activeText = texts.find(t => t.id === currentTextId);
      const readerContent = document.getElementById('reader-content');
      const currentTitleEl = document.getElementById('current-title');
      const emptyState = document.getElementById('empty-state');

      if (!activeText) {
        currentTitleEl.textContent = "文章がありません";
        readerContent.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      currentTitleEl.textContent = activeText.title;
      readerContent.innerHTML = '';

      if (config.isRaw) {
        const p = document.createElement('p');
        p.className = "text-slate-800 leading-relaxed font-normal tracking-wide";
        const fullText = activeText.data
          .map(s => s.chunks.map(c => c.en).join(' '))
          .join(' ');
        p.textContent = fullText;
        readerContent.appendChild(p);
        return;
      }

      activeText.data.forEach((sentence, sIdx) => {
        const sentenceDiv = document.createElement('div');
        sentenceDiv.className = "sentence-block flex flex-wrap items-baseline gap-y-2";

        sentence.chunks.forEach((chunk, cIdx) => {
          const chunkKey = `${sIdx}-${cIdx}`;
          const isLastChunk = cIdx === sentence.chunks.length - 1;

          const chunkWrap = document.createElement('div');
          chunkWrap.className = "inline-flex flex-col mx-0.5 px-1.5 py-1 rounded-lg chunk-hover cursor-pointer";
          
          chunkWrap.onclick = () => {
            if (config.transMode === 'tap') {
              tappedChunks[chunkKey] = !tappedChunks[chunkKey];
              renderReader();
            }
          };

          const enSpan = document.createElement('span');
          enSpan.className = "font-medium select-none tracking-wide";
          
          if (config.showHighlight && chunk.is_important) {
            enSpan.classList.add('text-rose-600', 'font-semibold', 'bg-rose-50/80', 'px-1', 'rounded');
          } else {
            enSpan.classList.add('text-slate-800');
          }
          
          enSpan.textContent = chunk.en;
          chunkWrap.appendChild(enSpan);

          let showJa = false;
          if (config.transMode === 'all') showJa = true;
          if (config.transMode === 'tap' && tappedChunks[chunkKey]) showJa = true;

          if (showJa && chunk.ja) {
            const jaSpan = document.createElement('span');
            jaSpan.className = "text-xs text-indigo-600 font-normal mt-1 animate-pop tracking-normal";
            jaSpan.textContent = chunk.ja;
            chunkWrap.appendChild(jaSpan);
          }

          sentenceDiv.appendChild(chunkWrap);

          if (config.showSlash && !isLastChunk) {
            const slashSpan = document.createElement('span');
            slashSpan.className = "text-indigo-300 font-light mx-1 select-none text-base";
            slashSpan.textContent = "/";
            sentenceDiv.appendChild(slashSpan);
          }
        });

        readerContent.appendChild(sentenceDiv);
      });
    }

    // ★ スマート・インポート処理（JSON・生の英文両対応）
    function handleImport() {
      let inputVal = document.getElementById('import-text').value.trim();
      let titleVal = document.getElementById('import-title').value.trim();

      if (!inputVal) {
        alert('英文を入力してください。');
        return;
      }

      let parsedData = [];

      // 1. JSON形式としてのパース試行
      try {
        if (inputVal.startsWith('[') || inputVal.startsWith('{')) {
          parsedData = JSON.parse(inputVal);
        } else {
          throw new Error("Not JSON");
        }
      } catch (e) {
        // 2. 生の英文として自動解析・チャンク変換
        parsedData = parseRawTextToChunks(inputVal);
      }

      if (!titleVal) {
        // タイトル未入力時は先頭の単語から自動設定
        titleVal = inputVal.slice(0, 20).replace(/[\r\n]+/g, ' ') + '...';
      }

      const newText = {
        id: "text-" + Date.now(),
        title: titleVal,
        data: pa
