<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChunkReader - スラッシュリーディング & 音読管理</title>
  <!-- Tailwind CSS (デザイン用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome (アイコン用) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
    .chunk-item { transition: all 0.15s ease; }
    .chunk-item:hover { background-color: #f1f5f9; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー / ツールバー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      
      <!-- ロゴ & タイトル -->
      <div class="flex items-center space-x-3">
        <button id="btn-toggle-sidebar" class="md:hidden text-slate-600 hover:text-slate-900 p-1">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <h1 class="text-xl font-bold bg-gradient-to-r from-slate-800 to-slate-600 bg-clip-text text-transparent flex items-center gap-2">
          <i class="fa-solid fa-book-open text-indigo-600"></i> ChunkReader
        </h1>
      </div>

      <!-- 表示コントロール（トグル群） -->
      <div class="flex flex-wrap items-center gap-2 sm:gap-3 bg-slate-100 p-1.5 rounded-xl text-sm">
        
        <!-- スラッシュ ON/OFF -->
        <button id="toggle-slash" class="px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 bg-white text-slate-800 shadow-sm">
          <span class="font-bold text-indigo-600">/</span> スラッシュ
        </button>

        <!-- 赤字ハイライト ON/OFF -->
        <button id="toggle-highlight" class="px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 bg-white text-slate-800 shadow-sm">
          <span class="text-red-500 font-bold">🔴</span> 重要語
        </button>

        <!-- 和訳モード切替 -->
        <div class="flex bg-slate-200 p-0.5 rounded-lg text-xs font-semibold">
          <button id="mode-tap" class="px-2.5 py-1 rounded-md transition bg-white text-indigo-600 shadow-sm">タップ表示</button>
          <button id="mode-all" class="px-2.5 py-1 rounded-md transition text-slate-600 hover:text-slate-900">全表示</button>
          <button id="mode-none" class="px-2.5 py-1 rounded-md transition text-slate-600 hover:text-slate-900">非表示</button>
        </div>

        <!-- 白文（Raw）モード -->
        <button id="toggle-raw" class="px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 border border-slate-300 text-slate-600 hover:bg-white">
          <i class="fa-solid fa-leaf text-emerald-500"></i> 白文
        </button>
      </div>

    </div>
  </header>

  <!-- メインコンテンツ領域 -->
  <div class="flex-1 flex max-w-7xl w-full mx-auto">
    
    <!-- サイドバー：登録英文一覧 -->
    <aside id="sidebar" class="w-80 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col justify-between hidden md:flex">
      <div class="p-4">
        <button id="btn-open-import" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-sm transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus"></i> 新しい英文を追加
        </button>

        <div class="mt-6">
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">保存した英文</h2>
          <ul id="text-list" class="space-y-1">
            <!-- 動的に英文リストが挿入されます -->
          </ul>
        </div>
      </div>
      <div class="p-4 border-t border-slate-100 text-xs text-slate-400 text-center">
        データはブラウザに自動保存されます
      </div>
    </aside>

    <!-- メイン読解エリア -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
      <div class="max-w-4xl mx-auto bg-white rounded-2xl p-6 md:p-10 shadow-sm border border-slate-200/80 min-h-[500px] flex flex-col">
        
        <!-- 文章ヘッダー -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-6">
          <h2 id="current-title" class="text-xl md:text-2xl font-bold text-slate-800">
            <!-- タイトルがここに表示されます -->
          </h2>
          <button id="btn-delete-text" class="text-slate-400 hover:text-red-500 p-2 transition" title="この文章を削除">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>

        <!-- 英文レンダリング領域 -->
        <div id="reader-content" class="space-y-6 text-lg md:text-xl leading-relaxed flex-1">
          <!-- ここにチャンク化された英文が動的に描画されます -->
        </div>

      </div>
    </main>

  </div>

  <!-- インポートモーダル (JSON貼り付け画面) -->
  <div id="modal-import" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="text-lg font-bold text-slate-800">新しい英文を登録 (JSON)</h3>
        <button id="btn-close-import" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">タイトル</label>
          <input type="text" id="import-title" placeholder="例: AIと将来の仕事（ニュース解説）" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">LLMが出力したJSONデータ</label>
          <textarea id="import-json" rows="8" placeholder="[ { &quot;sentence_id&quot;: 1, &quot;chunks&quot;: [...] } ]" class="w-full px-3 py-2 border border-slate-200 rounded-lg font-mono text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-2">
        <button id="btn-cancel-import" class="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100 text-sm font-medium">キャンセル</button>
        <button id="btn-save-import" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium shadow-sm">保存する</button>
      </div>
    </div>
  </div>

  <!-- アプリのJSロジック -->
  <script>

    const SAMPLE_DATA = {

    };
